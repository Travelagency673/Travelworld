
<!-- Search UI -->
<input type="text" id="apiSearchInput" placeholder="Search database..." style="padding: 8px;">
<button id="apiSearchBtn" style="padding: 8px 15px; cursor: pointer;">Search</button>

<!-- Area where results will appear -->
<div id="searchResults" style="margin-top: 15px;"></div>

<script>
  document.getElementById('apiSearchBtn').addEventListener('click', async () => {
    const query = document.getElementById('apiSearchInput').value.trim();
    const resultsDiv = document.getElementById('searchResults');
    
    if (!query) {
      resultsDiv.innerHTML = '<p>Please enter a search term.</p>';
      return;
    }

    resultsDiv.innerHTML = '<p>Searching...</p>'; // Loading state

    try {
      // REPLACE THIS URL with your actual backend or API endpoint
      const response = await fetch(`https://jsonplaceholder.typicode.com/posts?title_like=${encodeURIComponent(query)}`);
      const data = await response.json();

      resultsDiv.innerHTML = ''; // Clear loading message

      if (data.length === 0) {
        resultsDiv.innerHTML = '<p>No results found.</p>';
      } else {
        // Display the results (adjust 'item.title' based on your actual API data)
        data.forEach(item => {
          resultsDiv.innerHTML += `<div style="padding: 10px; border-bottom: 1px solid #eee;">${item.title}</div>`;
        });
      }
    } catch (error) {
      console.error('Search failed:', error);
      resultsDiv.innerHTML = '<p style="color: red;">An error occurred while searching.</p>';
    }
  });
</script>
