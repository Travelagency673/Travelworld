
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Details - Armenia Travel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2D3436;
            --light: #F7F9FC;
            --gradient-primary: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            --gradient-secondary: linear-gradient(135deg, #4ECDC4 0%, #22A6B3 100%);
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background-color: var(--light);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-btn {
            padding: 0.5rem 1.5rem;
            background: var(--gradient-secondary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.3s;
        }

        .back-btn:hover { transform: translateX(-5px); }

        /* Hero Section */
        .destination-hero {
            margin-top: 70px;
            height: 60vh;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 3rem 2rem;
        }

        .destination-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            color: white;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .hero-content .price {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Main Content */
        .destination-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
            margin-top: 2rem;
        }

        .description-section {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .description-section h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .description-section p {
            margin-bottom: 1.5rem;
            color: #555;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .highlights {
            margin-top: 2rem;
        }

        .highlights h3 {
            color: var(--dark);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .highlights ul {
            list-style: none;
            padding: 0;
        }

        .highlights li {
            padding: 0.8rem 0;
            padding-left: 2rem;
            position: relative;
            color: #555;
            border-bottom: 1px solid #eee;
        }

        .highlights li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--secondary);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Sidebar */
        .booking-sidebar {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .booking-sidebar h3 {
            color: var(--dark);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .price-box {
            background: var(--gradient-primary);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .price-box .amount {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
        }

        .price-box .per-person {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }

        .info-item i {
            color: var(--secondary);
            font-size: 1.2rem;
            width: 30px;
        }

        .book-now-btn {
            width: 100%;
            background: var(--gradient-secondary);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.3s;
        }

        .book-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(78, 205, 196, 0.3);
        }

        /* Gallery */
        .gallery {
            margin-top: 3rem;
        }

        .gallery h2 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .gallery-item {
            height: 250px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .hero-content h1 {
                font-size: 2.5rem;
            }
            
            .booking-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-plane-departure"></i> Armenia Travel</a>
            <a href="index.html#destinations" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Destinations
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="destination-hero" id="destinationHero">
        <div class="hero-content">
            <h1 id="destName">Loading...</h1>
            <div class="price" id="destPrice">$0</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="destination-container">
        <div class="content-grid">
            <!-- Description -->
            <div class="description-section">
                <h2 data-en="About This Destination" data-hy="Այս ուղղության մասին" data-ru="Об этом направлении">About This Destination</h2>
                <p id="destDescription">Loading description...</p>
                
                <div class="highlights">
                    <h3 data-en="Trip Highlights" data-hy="Ուղևորության առանձնահատկություններ" data-ru="Основные моменты поездки">Trip Highlights</h3>
                    <ul id="destHighlights">
                        <!-- Highlights will be inserted here -->
                    </ul>
                </div>

                <div class="gallery">
                    <h2 data-en="Photo Gallery" data-hy="Լուսանկարների պատկերասրահ" data-ru="Фотогалерея">Photo Gallery</h2>
                    <div class="gallery-grid" id="destGallery">
                        <!-- Gallery images will be inserted here -->
                    </div>
                </div>
            </div>

            <!-- Booking Sidebar -->
            <div class="booking-sidebar">
                <h3 data-en="Book This Trip" data-hy="Ամրագրել այս ուղևորությունը" data-ru="Забронировать эту поездку">Book This Trip</h3>
                
                <div class="price-box">
                    <span class="amount" id="sidebarPrice">$0</span>
                    <span class="per-person" data-en="per person" data-hy="մեկ անձի համար" data-ru="на человека">per person</span>
                </div>

                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <div>
                        <strong data-en="Duration" data-hy="Տևողություն" data-ru="Продолжительность">Duration</strong>
                        <p id="sidebarDuration">0 Days</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-star"></i>
                    <div>
                        <strong data-en="Rating" data-hy="Վարկանիշ" data-ru="Рейтинг">Rating</strong>
                        <p id="sidebarRating">0.0</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-users"></i>
                    <div>
                        <strong data-en="Group Size" data-hy="Խմբի չաս" data-ru="Размер группы">Group Size</strong>
                        <p data-en="Small Group (Max 12)" data-hy="Փոքր խումբ (առավելագույնը 12)" data-ru="Малая группа (макс. 12)">Small Group (Max 12)</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <strong data-en="Available" data-hy="Հասանելի" data-ru="Доступно">Available</strong>
                        <p data-en="Year Round" data-hy="Ամբողջ տարի" data-ru="Круглый год">Year Round</p>
                    </div>
                </div>

                <button class="book-now-btn" onclick="openBookingFromDetail()" data-en="Book Now" data-hy="Ամրագրել հիմա" data-ru="Забронировать сейчас">Book Now</button>
            </div>
        </div>
    </div>

                ]

        };

        // Get destination ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const destId = urlParams.get('id');

        // Load destination data
        function loadDestination() {
            if (destId && destinations[destId]) {
                const dest = destinations[destId];
                
                // Update hero section
                document.getElementById('destinationHero').style.backgroundImage = `url('${dest.image}')`;
                document.getElementById('destName').textContent = dest.name;
                document.getElementById('destPrice').textContent = dest.price;
                
                // Update description
                document.getElementById('destDescription').textContent = dest.description;
                
                // Update sidebar
                document.getElementById('sidebarPrice').textContent = dest.price;
                document.getElementById('sidebarDuration').textContent = dest.duration;
                document.getElementById('sidebarRating').textContent = dest.rating;
                
                // Update highlights
                const highlightsList = document.getElementById('destHighlights');
                highlightsList.innerHTML = dest.highlights.map(hl => `<li>${hl}</li>`).join('');
                
                // Update gallery
                const galleryGrid = document.getElementById('destGallery');
                galleryGrid.innerHTML = dest.gallery.map(img => 
                    `<div class="gallery-item" style="background-image: url('${img}')"></div>`
                ).join('');
                
                // Update page title
                document.title = `${dest.name} - Armenia Travel`;
            } else {
                // Redirect to home if invalid destination
                window.location.href = 'index.html';
            }
        }

        // Open booking modal (you'll need to add this to your main index.html modal)
        function openBookingFromDetail() {
            const destName = document.getElementById('destName').textContent;
            // Store in localStorage to pass to index.html
            localStorage.setItem('bookingDestination', destName);
            window.location.href = 'index.html#booking';
        }

        // Initialize
        window.onload = loadDestination;
    </script>
</body>
</html>
